<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Badge & Header -->
  <rect x="80" y="55" width="280" height="36" rx="18" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5" />
  <text x="220" y="79" fill="#a855f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">DICTAMEN &amp; OFERTA FINAL</text>

  <text x="80" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="40" font-weight="800">Conclusiones &amp; Propuesta para Emprendedores</text>
  <text x="80" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19">Los cuatro sellos de viabilidad que convierten a JuanFer Shop en un negocio escalable y de bajo riesgo</text>

  <!-- 4 Viability Pillars Grid (width 345 each) -->
  <!-- Pillar 1: Tecnica -->
  <rect x="80" y="215" width="345" height="420" rx="14" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.5" />
  <rect x="80" y="215" width="345" height="6" rx="3" fill="#34d399" />
  <circle cx="120" cy="265" r="22" fill="#34d399" fill-opacity="0.2" />
  <text x="120" y="272" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">💻</text>
  <text x="155" y="272" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Viabilidad Técnica</text>
  <text x="105" y="315" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Autonomía y Escalabilidad</text>

  <text x="105" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">React 19 + Firebase:</tspan></text>
  <text x="120" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">Sin ataduras a CMS comerciales.</text>

  <text x="105" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Sub-segundo LCP &lt; 1,2s:</tspan></text>
  <text x="120" y="418" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">Stock atómico sin overselling.</text>

  <text x="105" y="451" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Ahorro Cloud 85%:</tspan></text>
  <text x="120" y="471" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">Serverless ágil por &lt; $5/mes.</text>

  <line x1="105" y1="495" x2="395" y2="495" stroke="#334155" stroke-width="1" />
  <text x="105" y="525" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dictamen Cátedra:</text>
  <text x="105" y="547" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Solución técnica validada en</text>
  <text x="105" y="567" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">entorno real de producción.</text>


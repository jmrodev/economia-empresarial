  <text x="835" y="315" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">S.A.S. Ley 27.349</text>

  <text x="835" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Blindaje Patrimonial:</tspan></text>
  <text x="850" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">Art. 34: bienes personales a salvo.</text>


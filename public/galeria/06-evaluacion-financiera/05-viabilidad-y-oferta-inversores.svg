  <text x="470" y="525" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Diferencial Clave:</text>
  <text x="470" y="547" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Insignia "Llega Mañana" que</text>
  <text x="470" y="567" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">maximiza conversión publicitaria.</text>


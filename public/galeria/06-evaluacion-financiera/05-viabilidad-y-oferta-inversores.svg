  <text x="835" y="451" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Cargas Reales (45-48%):</tspan></text>
  <text x="850" y="471" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">F.931, ART y SAC computados.</text>

  <line x1="835" y1="495" x2="1125" y2="495" stroke="#334155" stroke-width="1" />
  <text x="835" y="525" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Seguridad Jurídica:</text>
  <text x="835" y="547" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Cero pasivos contingentes y</text>
  <text x="835" y="567" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">apego a defensa del consumidor.</text>


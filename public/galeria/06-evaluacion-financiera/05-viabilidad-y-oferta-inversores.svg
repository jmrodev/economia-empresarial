  <text x="1215" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">$ 7.259.000 ARS (0% deuda).</text>

  <text x="1200" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Margen Ponderado 39%:</tspan></text>
  <text x="1215" y="418" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">MCU $ 26.411 por unidad.</text>

  <text x="1200" y="451" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Equilibrio en Mes 2:</tspan></text>
  <text x="1215" y="471" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">467 u. arranque / 647 u. pleno.</text>

  <line x1="1200" y1="495" x2="1490" y2="495" stroke="#334155" stroke-width="1" />
  <text x="1200" y="525" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Beneficio Neto Año 1:</text>
  <text x="1200" y="555" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">+$ 52.737.539</text>

  <!-- Big Bottom Investor Offer & Team Card -->
  <rect x="80" y="660" width="1440" height="185" rx="14" fill="url(#card-grad)" stroke="#a855f7" stroke-width="2" />
  
  <text x="120" y="702" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="21" font-weight="800">Por qué Invertir o Replicar el Modelo JuanFer Shop S.A.S.</text>
  
  <text x="120" y="735" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">
    1. <tspan fill="#f8fafc" font-weight="700">Alta Rotación de Capital:</tspan> Reposición cada 7-8 días que multiplica la liquidez sin deuda.
  </text>
  <text x="120" y="765" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">
    2. <tspan fill="#f8fafc" font-weight="700">Política de Reinversión:</tspan> 70% a nuevo stock mayorista ($ 36,9M) + 30% a reserva técnica.
  </text>
  <text x="120" y="795" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">
    3. <tspan fill="#f8fafc" font-weight="700">Equipo Fundador Complementario:</tspan> Juan Ignacio (IT), María Fernanda (Ventas), Juan Marcelo (Finanzas).
  </text>

  <rect x="1190" y="685" width="300" height="135" rx="12" fill="#0b0f19" stroke="#34d399" stroke-width="1.5" />
  <text x="1215" y="720" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Dictamen Final:</text>
  <text x="1215" y="750" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">PROYECTO VIABLE</text>
  <text x="1215" y="780" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Oportunidad rentable, formal</text>
  <text x="1215" y="800" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">y escalable en el país.</text>
</svg>

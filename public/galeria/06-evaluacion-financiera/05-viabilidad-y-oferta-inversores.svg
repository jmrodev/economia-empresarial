  <text x="470" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Mercado Envíos Full:</tspan></text>
  <text x="485" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">Despacho &lt; 24h a todo el país.</text>

  <text x="470" y="398" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Packaging Bonificado:</tspan></text>
  <text x="485" y="418" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">Costo $0 de empaque y cajas.</text>

  <text x="470" y="451" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">● <tspan fill="#f8fafc" font-weight="700">Target 2,4M Remotos:</tspan></text>
  <text x="485" y="471" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">Alta frecuencia de compra online.</text>


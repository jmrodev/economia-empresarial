<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Badge & Header -->
  <rect x="70" y="45" width="280" height="36" rx="18" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
  <text x="210" y="69" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">EVALUACIÓN ECONÓMICA • CAPEX</text>

  <text x="70" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="800">Inversión Inicial Requerida (Capex de Arranque)</text>
  <text x="70" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Puesta en marcha formal de JuanFer Shop S.A.S. • Sin endeudamiento bancario</text>

  <!-- Total Capex Callout Card (x=70 to x=1530, width=1460) -->
  <rect x="70" y="195" width="1460" height="135" rx="16" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" />
  <text x="110" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">CAPEX TOTAL DE APERTURA</text>
  <text x="110" y="295" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="42" font-weight="800">$ 7.259.000,00 ARS</text>

  <text x="740" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">ESTRUCTURA DE FINANCIAMIENTO</text>
  <text x="740" y="285" fill="#34d399" font-family="system-ui, sans-serif" font-size="26" font-weight="700">100% Autofinanciado con Capital Propio</text>
  <text x="740" y="312" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Aporte de $ 2.420.000 ARS por cada uno de los 3 socios • TNA bancaria: 0%</text>

  <!-- Grid of 6 breakdown cards (width 460 each, x=70, 570, 1070) -->
  <!-- Card 1: Stock -->
  <rect x="70" y="355" width="460" height="240" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <rect x="70" y="355" width="460" height="6" rx="3" fill="#38bdf8" />
  <text x="100" y="400" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Stock Inicial Mayorista (CMV)</text>
  <text x="100" y="445" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$ 4.414.000</text>
  <text x="100" y="475" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">60,81% del Capex Total</text>
  <text x="100" y="515" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Lote de 166 unidades en 15 artículos</text>
  <text x="100" y="540" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Valuado al costo de adquisición mayorista</text>
  <text x="100" y="565" fill="#34d399" font-family="system-ui, sans-serif" font-size="14">Valor de venta proyectado: $ 11.217.470</text>

  <!-- Card 2: Garantia Inmueble -->
  <rect x="570" y="355" width="460" height="240" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <rect x="570" y="355" width="460" height="6" rx="3" fill="#818cf8" />
  <text x="600" y="400" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Depósito Garantía Alquiler</text>
  <text x="600" y="445" fill="#818cf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$ 1.400.000</text>
  <text x="600" y="475" fill="#818cf8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">19,29% del Capex Total</text>
  <text x="600" y="515" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">2 meses de canon locativo comercial</text>
  <text x="600" y="540" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Base operativa en Tandil</text>
  <text x="600" y="565" fill="#34d399" font-family="system-ui, sans-serif" font-size="14">Activo contractual 100% recuperable</text>

  <!-- Card 3: Hardware y Equipamiento -->
  <rect x="1070" y="355" width="460" height="240" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <rect x="1070" y="355" width="460" height="6" rx="3" fill="#34d399" />
  <text x="1100" y="400" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Equipamiento e Infraestructura</text>
  <text x="1100" y="445" fill="#34d399" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$ 800.000</text>
  <text x="1100" y="475" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="600">11,02% del Capex Total</text>
  <text x="1100" y="515" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Terminales de trabajo y puesto testing QA</text>
  <text x="1100" y="540" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Lectores ópticos de código de barras</text>
  <text x="1100" y="565" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Impresora térmica de etiquetas para Full</text>

  <!-- Row 2 (y=620) -->
  <!-- Card 4: Legal SAS -->
  <rect x="70" y="620" width="460" height="240" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <rect x="70" y="620" width="460" height="6" rx="3" fill="#f59e0b" />
  <text x="100" y="665" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Constitución Legal S.A.S.</text>
  <text x="100" y="710" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$ 300.000</text>
  <text x="100" y="740" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15" font-weight="600">4,13% del Capex Total</text>
  <text x="100" y="780" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Aranceles de inscripción DPPJ / IGJ</text>
  <text x="100" y="805" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Publicación edictos en Boletín Oficial</text>
  <text x="100" y="830" fill="#34d399" font-family="system-ui, sans-serif" font-size="14">Blindaje patrimonial socios (Art. 34)</text>

  <!-- Card 5: Seguro Caucion -->
  <rect x="570" y="620" width="460" height="240" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <rect x="570" y="620" width="460" height="6" rx="3" fill="#ec4899" />
  <text x="600" y="665" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Seguro Caución Locativa</text>
  <text x="600" y="710" fill="#ec4899" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$ 250.000</text>
  <text x="600" y="740" fill="#ec4899" font-family="system-ui, sans-serif" font-size="15" font-weight="600">3,44% del Capex Total</text>
  <text x="600" y="780" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Póliza comercial aprobada por SSN</text>
  <text x="600" y="805" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Garantía locativa sin comprometer</text>
  <text x="600" y="830" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">inmuebles particulares de los socios</text>

  <!-- Card 6: Marketing + Cloud + Dominio -->
  <rect x="1070" y="620" width="460" height="240" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <rect x="1070" y="620" width="460" height="6" rx="3" fill="#06b6d4" />
  <text x="1100" y="665" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Setup, Cloud &amp; Marketing</text>
  <text x="1100" y="710" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$ 95.000</text>
  <text x="1100" y="740" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="15" font-weight="600">1,31% del Capex Total</text>
  <text x="1100" y="780" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Pauta digital Meta y TikTok ($50k)</text>
  <text x="1100" y="805" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Dominio comercial NIC.ar y SSL ($30k)</text>
  <text x="1100" y="830" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Puesta a punto clúster AWS/Firebase ($15k)</text>
</svg>
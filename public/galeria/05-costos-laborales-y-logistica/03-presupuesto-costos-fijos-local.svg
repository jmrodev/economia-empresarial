<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stroke-opacity="0.9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stroke-opacity="0.95" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Badge & Header -->
  <rect x="70" y="45" width="310" height="36" rx="18" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
  <text x="225" y="69" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PRESUPUESTO OPERATIVO MENSUAL</text>

  <text x="70" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="800">Evolución de Costos Fijos Operativos (Opex)</text>
  <text x="70" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Estructura cuantitativa de costos fijos mensuales y puntos de equilibrio: Fase de Arranque vs. Régimen Pleno</text>

  <!-- 2 Big Cards: width 700 each, x=70, 830 -->
  <!-- Col 1: Fase Inicial Fundacional (Mes 1) -->
  <rect x="70" y="195" width="700" height="665" rx="16" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" />
  <rect x="70" y="195" width="700" height="8" rx="4" fill="#38bdf8" />
  
  <rect x="105" y="230" width="190" height="30" rx="6" fill="#38bdf8" fill-opacity="0.15" />
  <text x="200" y="250" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FASE ARRANQUE (MES 1)</text>
  
  <text x="105" y="315" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="48" font-weight="800">$ 12.314.925</text>
  <text x="105" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">ARS / mes • Equipo técnico inicial (3 perfiles) + local comercial en Tandil</text>
  <line x1="105" y1="375" x2="735" y2="375" stroke="#334155" stroke-width="1.5" />

  <text x="105" y="415" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Desglose de Costos Fijos Mes 1:</text>
  
  <text x="105" y="450" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● Nómina Técnica (3 Desarrolladores IT):</text>
  <text x="125" y="475" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Sueldos bajo CCT 1696/23 Unión Informática con F.931 y cargas ($ 9.405.386,53 ARS).</text>

  <text x="105" y="520" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● Inmueble Comercial Operativo en Tandil:</text>
  <text x="125" y="545" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Alquiler local ($ 700.000 ARS) + alarma monitoreada, mantenimiento e higiene ($ 150.000 ARS).</text>

  <text x="105" y="590" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● Infraestructura Cloud &amp; Licencias de Software:</text>
  <text x="125" y="615" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Servidores AWS/Firebase ($ 150.000 ARS) + OpenAI Team, M365 y GitHub ($ 185.000 ARS).</text>

  <text x="105" y="660" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● Servicios Operativos y Asesoría Contable:</text>
  <text x="125" y="685" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Estudio contable/laboral S.A.S. ($ 320.000 ARS) + electricidad, gas e internet simétrico 4G ($ 185.000 ARS).</text>

  <rect x="105" y="725" width="630" height="105" rx="12" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" />
  <text x="135" y="760" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Punto de Equilibrio Inicial (Break-Even):</text>
  <text x="135" y="800" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">467 unidades / mes</text>
  <text x="430" y="800" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Facturación requerida: $ 31.557.581 ARS (~15 vtas/día)</text>

  <!-- Col 2: Régimen Pleno (Mes 3+) -->
  <rect x="830" y="195" width="700" height="665" rx="16" fill="url(#card-grad)" stroke="#10b981" stroke-width="2.5" />
  <rect x="830" y="195" width="700" height="8" rx="4" fill="#10b981" />
  
  <rect x="865" y="230" width="220" height="30" rx="6" fill="#10b981" fill-opacity="0.15" />
  <text x="975" y="250" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">RÉGIMEN PLENO (MES 3 EN ADELANTE)</text>
  
  <text x="865" y="315" fill="#10b981" font-family="system-ui, sans-serif" font-size="48" font-weight="800">$ 17.063.797</text>
  <text x="865" y="345" fill="#34d399" font-family="system-ui, sans-serif" font-size="16">ARS / mes • Nómina completa (5 dependientes) + local comercial + fondo de reserva</text>
  <line x1="865" y1="375" x2="1495" y2="375" stroke="#334155" stroke-width="1.5" />

  <text x="865" y="415" fill="#10b981" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Estructura Plena en Régimen:</text>
  
  <text x="865" y="450" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● Nómina Completa 5 Puestos Formales:</text>
  <text x="885" y="475" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">3 Desarrolladores IT (CCT AGC) + 2 Comerciales Digitales (CCT FAECyS) con cargas ($ 13.722.543,57 ARS).</text>

  <text x="865" y="520" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● Base Comercial, Alquiler y Mantenimiento:</text>
  <text x="885" y="545" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Alquiler local ($ 700k) + monitoreo, mantenimiento edilicio, higiene y reposición ($ 250.000 ARS).</text>

  <text x="865" y="590" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● Cloud Serverless, Licencias y Estudio Contable:</text>
  <text x="885" y="615" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">AWS/Firebase ($ 150k) + software IA ($ 185k) + asesoría contable integral S.A.S. ($ 320.000 ARS).</text>

  <text x="865" y="660" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">● Fondo de Reserva y Contingencias (10%):</text>
  <text x="885" y="685" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Previsión prudencial ante variaciones inflacionarias o imprevistos de mercado ($ 1.551.254,36 ARS).</text>

  <rect x="865" y="725" width="630" height="105" rx="12" fill="#0b0f19" stroke="#10b981" stroke-width="1.5" />
  <text x="895" y="760" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Punto de Equilibrio Pleno (Break-Even):</text>
  <text x="895" y="800" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">647 unidades / mes</text>
  <text x="1190" y="800" fill="#34d399" font-family="system-ui, sans-serif" font-size="15">Superado con creces desde el Mes 2 (~21 vtas/día)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Badge & Header -->
  <rect x="80" y="55" width="280" height="36" rx="18" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" />
  <text x="220" y="79" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">LOGÍSTICA &amp; DISTRIBUCIÓN</text>

  <text x="80" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="40" font-weight="800">Modelo Logístico: Mercado Envíos Full</text>
  <text x="80" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19">Almacenamiento centralizado, empaque bonificado y entregas ultra-rápidas a todo el país</text>

  <!-- Top 3 Pillars -->
  <rect x="80" y="210" width="455" height="150" rx="14" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="110" y="255" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="16" font-weight="700">ENTREGA ULTRA-RÁPIDA</text>
  <text x="110" y="300" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="800">&lt; 24 Horas</text>
  <text x="110" y="330" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Insignia verde oficial "Llega Mañana"</text>

  <rect x="572" y="210" width="455" height="150" rx="14" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.5" />
  <text x="602" y="255" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="700">PACKAGING TÉCNICO BONIFICADO</text>
  <text x="602" y="300" fill="#34d399" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$ 0,00 ARS</text>
  <text x="602" y="330" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Cajas, bolsas y etiquetas 100% bonificadas</text>

  <rect x="1065" y="210" width="455" height="150" rx="14" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.5" />
  <text x="1095" y="255" fill="#818cf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">COBERTURA NACIONAL</text>
  <text x="1095" y="300" fill="#818cf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">100% País</text>
  <text x="1095" y="330" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Sin costo de flota vehicular propia</text>

  <!-- Workflow and Details Card -->
  <rect x="80" y="390" width="1440" height="450" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <text x="120" y="445" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Flujo Operativo de Fulfillment</text>
  <text x="120" y="475" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Cómo se transforman 166 unidades de inventario en una operación de escala continua</text>

  <!-- Step 1 -->
  <rect x="120" y="510" width="310" height="280" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1" />
  <circle cx="160" cy="550" r="20" fill="#06b6d4" />
  <text x="160" y="556" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">1</text>
  <text x="195" y="556" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Flete Inbound</text>
  <text x="140" y="605" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Ingreso Consolidado:</text>
  <text x="140" y="633" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Envío masivo en pallets</text>
  <text x="140" y="653" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">desde proveedores y Tandil</text>
  <text x="140" y="673" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">hacia centro Full La Matanza.</text>
  <text x="140" y="715" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Costo medio: $ 600 / unidad</text>
  <text x="140" y="740" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Silla ergonómica: $ 2.500</text>

  <!-- Step 2 -->
  <rect x="475" y="510" width="310" height="280" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1" />
  <circle cx="515" cy="550" r="20" fill="#38bdf8" />
  <text x="515" y="556" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">2</text>
  <text x="550" y="556" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Picking &amp; Packing</text>
  <text x="495" y="605" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Operación 24/7:</text>
  <text x="495" y="633" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Al comprar en la web,</text>
  <text x="495" y="653" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">el depósito prepara y embala</text>
  <text x="495" y="673" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">el paquete al instante.</text>
  <text x="495" y="715" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Packaging Bonificado ($0)</text>
  <text x="495" y="740" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Control estricto de averías</text>

  <!-- Step 3 -->
  <rect x="830" y="510" width="310" height="280" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1" />
  <circle cx="870" cy="550" r="20" fill="#818cf8" />
  <text x="870" y="556" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">3</text>
  <text x="905" y="556" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Última Milla Express</text>
  <text x="850" y="605" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Despacho Inmediato:</text>
  <text x="850" y="633" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Flota aérea y terrestre de</text>
  <text x="850" y="653" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Mercado Envíos hacia el</text>
  <text x="850" y="673" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">domicilio en &lt; 24 horas.</text>
  <text x="850" y="715" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Umbral $ 33.000 ARS</text>
  <text x="850" y="740" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Envío gratis bonificado</text>

  <!-- Step 4 -->
  <rect x="1185" y="510" width="305" height="280" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1" />
  <circle cx="1225" cy="550" r="20" fill="#10b981" />
  <text x="1225" y="556" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">4</text>
  <text x="1260" y="556" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Cobro &amp; Reposición</text>
  <text x="1205" y="605" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Ciclo de 24 a 48 hs:</text>
  <text x="1205" y="633" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Fondos acreditados para</text>
  <text x="1205" y="653" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">recompra y rotación de</text>
  <text x="1205" y="673" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">nuevo stock mayorista.</text>
  <text x="1205" y="715" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Rotación: cada 7-8 días</text>
  <text x="1205" y="740" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Cero quiebres de stock</text>
</svg>

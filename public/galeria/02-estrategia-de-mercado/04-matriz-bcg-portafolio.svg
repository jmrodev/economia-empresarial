  <text x="845" y="640" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Wool Winter Scarf (14 u.):</tspan> PVU $ 34.990 | Margen: $ 11.941</text>
  <text x="845" y="670" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Artículo estacional fuera de ciclo invernal.</text>

  <rect x="840" y="700" width="665" height="100" rx="10" fill="#0b0f19" stroke="#334155" stroke-width="1" />
  <text x="860" y="728" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Mecanismo de Liquidación Automática en Plataforma:</text>
  <text x="860" y="753" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Se activa el distintivo <tspan fill="#f59e0b" font-weight="700">"onSale"</tspan> en React con rebaja dinámica del 15% al 20%</text>
  <text x="860" y="778" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">para rotar el lote en 15 días y liberar capital hacia productos Estrella.</text>

  <text x="845" y="830" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Resultado: Cero inmovilización o pérdida de mercadería en almacén Full.</text>

  <text x="100" y="670" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Stainless Steel Bottle (25 u.):</tspan> PVU $ 29.990 | Margen: $ 11.841 (39,5%)</text>
  <text x="100" y="700" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Bluetooth Speaker (18 u.):</tspan> PVU $ 59.990 | Margen: $ 23.191 (38,7%)</text>
  <text x="100" y="730" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#94a3b8">Básicos:</tspan> Denim Jacket, T-Shirt, Leather Wallet, Fitness Band</text>

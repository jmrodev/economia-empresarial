  <text x="100" y="430" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Estrategia Comercial:</text>
  <text x="100" y="455" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Inversión prioritaria en pauta digital para sostener liderazgo y volumen.</text>
  <text x="100" y="480" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Aportan el 41% de la ganancia bruta total del lote de arranque.</text>


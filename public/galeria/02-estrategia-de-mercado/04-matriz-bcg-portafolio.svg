  <text x="145" y="251" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Productos Estrella</text>
  <text x="430" y="251" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Alto Crecimiento • Alta Rentabilidad</text>

  <text x="100" y="295" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Wireless Headphones:</tspan> PVU $ 99.990 | Margen: $ 42.491 (42,5%)</text>
  <text x="100" y="330" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Minimalist Leather Watch:</tspan> PVU $ 149.500 | Margen: $ 65.565 (43,9%)</text>
  <text x="100" y="365" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Smart Coffee Maker:</tspan> PVU $ 89.990 | Margen: $ 34.791 (38,7%)</text>

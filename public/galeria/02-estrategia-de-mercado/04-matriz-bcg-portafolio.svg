  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Badge & Header -->
  <rect x="70" y="45" width="280" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
  <text x="210" y="69" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PORTAFOLIO COMERCIAL</text>

  <text x="70" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="800">Matriz BCG del Catálogo (15 Productos)</text>
  <text x="70" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Clasificación estratégica del inventario inicial según participación y tasa de crecimiento</text>


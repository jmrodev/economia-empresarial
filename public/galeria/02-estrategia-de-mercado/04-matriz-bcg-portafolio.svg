  <text x="845" y="455" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Artículos de ticket promedio alto; campañas de reviews y demostraciones.</text>
  <text x="845" y="480" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Potencial de migrar a categoría Estrella al consolidar reputación.</text>


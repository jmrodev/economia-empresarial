  <text x="100" y="790" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Estrategia Comercial:</text>
  <text x="100" y="815" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Flujo de caja regular que financia el capital de trabajo de reposición continua.</text>

  <!-- Quadrant 4: Perros -->
  <rect x="815" y="540" width="715" height="325" rx="14" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1.5" />
  <rect x="815" y="540" width="715" height="6" rx="3" fill="#f43f5e" />

  <text x="855" y="597" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">🐕</text>
  <text x="890" y="596" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Productos Perro (Estacionales)</text>

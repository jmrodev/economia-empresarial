<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Badge & Header -->
  <rect x="70" y="45" width="280" height="36" rx="18" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
  <text x="210" y="69" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">ESTUDIO DE MERCADO OFICIAL</text>

  <text x="70" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="800">Investigación de Mercado &amp; Target C1/ABC1</text>
  <text x="70" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Datos oficiales de CACE e INDEC que fundamentan la oportunidad comercial de JuanFer Shop</text>

  <!-- 3 Big Stat Pillars (width 460 each, x=70, 570, 1070) -->
  <rect x="70" y="195" width="460" height="175" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="100" y="240" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">CRECIMIENTO DEL E-COMMERCE</text>
  <text x="100" y="295" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="46" font-weight="800">+175%</text>
  <text x="100" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Facturación interanual según CACE en Argentina</text>

  <rect x="570" y="195" width="460" height="175" rx="14" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" />
  <text x="600" y="240" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="700">FACTOR DECISIVO DE COMPRA</text>
  <text x="600" y="295" fill="#10b981" font-family="system-ui, sans-serif" font-size="46" font-weight="800">78%</text>
  <text x="600" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Prioriza tiendas con entregas rápidas &lt; 24-48 hs</text>

  <rect x="1070" y="195" width="460" height="175" rx="14" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.5" />
  <text x="1100" y="240" fill="#818cf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">MERCADO POTENCIAL DIRECTO</text>
  <text x="1100" y="295" fill="#818cf8" font-family="system-ui, sans-serif" font-size="46" font-weight="800">2,4 M</text>
  <text x="1100" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Teletrabajadores en modelo remoto o híbrido (INDEC)</text>

  <!-- Detailed Segmentation Cards (width 710 each, x=70 to 780, and x=820 to 1530) -->
  <rect x="70" y="395" width="710" height="465" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <text x="100" y="445" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Perfil Sociodemográfico del Target</text>

  <!-- Item 1 -->
  <text x="100" y="495" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Segmento Económico: Estratos C1 y ABC1</text>
  <text x="100" y="525" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Población con ingresos medios y altos, capacidad de compra recurrente</text>
  <text x="100" y="547" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">y uso activo de tarjetas de crédito y saldo en billeteras digitales.</text>

  <!-- Item 2 -->
  <text x="100" y="605" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Edad y Actividad Principal:</text>
  <text x="100" y="635" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Jóvenes profesionales de 20 a 45 años: programadores, diseñadores UX,</text>
  <text x="100" y="657" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">consultores digitales, profesionales independientes y mandos medios.</text>

  <!-- Item 3 -->
  <text x="100" y="715" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Ubicación Estratégica:</text>
  <text x="100" y="745" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Grandes centros urbanos y polos tecnológicos del país: Tandil (polo IT),</text>
  <text x="100" y="767" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">CABA, Gran Buenos Aires, Córdoba, Rosario, Mar del Plata y Mendoza.</text>

  <!-- Card 2 -->
  <rect x="820" y="395" width="710" height="465" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  <text x="850" y="445" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Hábitos de Consumo &amp; Dolor del Usuario</text>

  <!-- Item 1 -->
  <text x="850" y="495" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Valoración del Tiempo y la Eficiencia:</text>
  <text x="850" y="525" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Rechazan plataformas lentas, interfaces pesadas o checkouts farragosos.</text>
  <text x="850" y="547" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Exigen compras ultra-rápidas completadas en menos de 60 segundos.</text>

  <!-- Item 2 -->
  <text x="850" y="605" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Prioridad por la Ergonomía y el Confort:</text>
  <text x="850" y="635" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Alta disposición a pagar por artículos de confort diario para su setup</text>
  <text x="850" y="657" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">(sillas ergonómicas, teclados mecánicos, mochilas y auriculares).</text>

  <!-- Item 3 -->
  <text x="850" y="715" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Certeza y Tranquilidad en la Entrega:</text>
  <text x="850" y="745" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">La insignia "Llega Mañana" de Mercado Envíos Full disipa dudas,</text>
  <text x="850" y="767" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">maximizando la tasa de conversión en campañas publicitarias.</text>
</svg>
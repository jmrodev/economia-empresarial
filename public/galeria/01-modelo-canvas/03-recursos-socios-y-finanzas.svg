<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Badge & Header -->
  <rect x="80" y="55" width="280" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
  <text x="220" y="79" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">MODELO CANVAS • BLOQUES 5 A 9</text>

  <text x="80" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="40" font-weight="800">Recursos, Actividades, Socios, Ingresos y Costos</text>
  <text x="80" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19">La infraestructura operativa y el motor económico que sustentan el negocio</text>

  <!-- 5 Cards Layout: Top 3 (Recursos, Actividades, Socios), Bottom 2 (Ingresos, Costes) -->
  <!-- Top 1: Recursos Clave -->
  <rect x="80" y="215" width="455" height="300" rx="14" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.5" />
  <rect x="80" y="215" width="455" height="6" rx="3" fill="#ec4899" />
  <circle cx="120" cy="265" r="20" fill="#ec4899" fill-opacity="0.2" />
  <text x="120" y="271" fill="#ec4899" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">06</text>
  <text x="155" y="271" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Recursos Clave</text>

  <text x="110" y="315" fill="#ec4899" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Activo Tecnológico Propio:</text>
  <text x="125" y="335" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Código SPA React 19 + Node.js + Firebase</text>

  <text x="110" y="365" fill="#ec4899" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Stock Físico Inicial:</text>
  <text x="125" y="385" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">166 unidades a costo ($ 4.414.000 ARS)</text>

  <text x="110" y="415" fill="#ec4899" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Capital Humano Formal:</text>
  <text x="125" y="435" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">3 desarrolladores IT y 2 agentes comerciales</text>

  <text x="110" y="465" fill="#ec4899" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Infraestructura Fija:</text>
  <text x="125" y="485" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Local comercial y base operativa en Tandil</text>

  <!-- Top 2: Actividades Clave -->
  <rect x="572" y="215" width="455" height="300" rx="14" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.5" />
  <rect x="572" y="215" width="455" height="6" rx="3" fill="#06b6d4" />
  <circle cx="612" cy="265" r="20" fill="#06b6d4" fill-opacity="0.2" />
  <text x="612" y="271" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">07</text>
  <text x="647" y="271" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Actividades Clave</text>

  <text x="602" y="315" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Curaduría &amp; Negociación:</text>
  <text x="617" y="335" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Compras por volumen con importadores directos</text>

  <text x="602" y="365" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Gestión Logística Full:</text>
  <text x="617" y="385" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Etiquetado, control y flete consolidado</text>

  <text x="602" y="415" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Mantenimiento &amp; Testing IT:</text>
  <text x="617" y="435" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Seguridad, reglas Firestore y testing continuo</text>

  <text x="602" y="465" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Marketing de Performance:</text>
  <text x="617" y="485" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Optimización CRO y campañas segmentadas</text>

  <!-- Top 3: Socios Clave -->
  <rect x="1065" y="215" width="455" height="300" rx="14" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5" />
  <rect x="1065" y="215" width="455" height="6" rx="3" fill="#a855f7" />
  <circle cx="1105" cy="265" r="20" fill="#a855f7" fill-opacity="0.2" />
  <text x="1105" y="271" fill="#a855f7" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">08</text>
  <text x="1140" y="271" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Socios Clave</text>

  <text x="1095" y="315" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Mercado Envíos Full:</text>
  <text x="1110" y="335" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Almacén de Fulfillment y flota de última milla</text>

  <text x="1095" y="365" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Distribuidores Mayoristas:</text>
  <text x="1110" y="385" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Proveedores autorizados de tecnología y textil</text>

  <text x="1095" y="415" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Google Cloud &amp; AWS:</text>
  <text x="1110" y="435" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Hosting serverless, base Firestore y CDN global</text>

  <text x="1095" y="465" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">● Pasarela Mercado Pago:</text>
  <text x="1110" y="485" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Procesamiento multicanal y liquidación ágil</text>

  <!-- Bottom Row: 2 Big Cards for Financial Pillars -->
  <!-- Bottom 1: Fuentes de Ingresos -->
  <rect x="80" y="540" width="700" height="310" rx="14" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" />
  <rect x="80" y="540" width="700" height="6" rx="3" fill="#10b981" />
  <circle cx="120" cy="590" r="20" fill="#10b981" fill-opacity="0.2" />
  <text x="120" y="596" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">05</text>
  <text x="155" y="596" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Fuentes de Ingresos</text>

  <text x="110" y="640" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Margen de Contribución Ponderado: 39,09%</text>
  <text x="110" y="670" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Venta minorista directa de artículos con ticket medio de $ 67.575 ARS.</text>
  <text x="110" y="710" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● Facturación proyectada lote inicial (166 u.): <tspan fill="#f8fafc" font-weight="700">$ 11.217.470 ARS</tspan></text>
  <text x="110" y="745" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● Facturación anual proyectada (10.670 u.): <tspan fill="#10b981" font-weight="700">$ 820.150.896 ARS</tspan></text>
  <text x="110" y="780" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Cobro multicanal con dinero en cuenta, tarjetas contactless y cuotas.</text>

  <!-- Bottom 2: Estructura de Costes -->
  <rect x="820" y="540" width="700" height="310" rx="14" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1.5" />
  <rect x="820" y="540" width="700" height="6" rx="3" fill="#f43f5e" />
  <circle cx="860" cy="590" r="20" fill="#f43f5e" fill-opacity="0.2" />
  <text x="860" y="596" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">09</text>
  <text x="895" y="596" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Estructura de Costes</text>

  <text x="850" y="640" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Costos Variables (~60,91%) &amp; Costos Fijos</text>
  <text x="850" y="670" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Variables:</tspan> CMV (39,35%), comisión ML (13%) y fletes Full de envío.</text>
  <text x="850" y="710" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Nómina Formal:</tspan> 5 puestos con cargas patronales reales (45-48%).</text>
  <text x="850" y="745" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">● <tspan fill="#f8fafc" font-weight="700">Opex Mensual:</tspan> $ 17.063.797 (Pleno) / $ 12.314.925 (Arranque).</text>
  <text x="850" y="780" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Incluye local en Tandil, energía T2, serverless AWS y contingencia 10%.</text>
</svg>

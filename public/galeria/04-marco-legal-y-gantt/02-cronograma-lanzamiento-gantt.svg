<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Badge & Header -->
  <rect x="80" y="55" width="280" height="36" rx="18" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
  <text x="220" y="79" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PLAN OPERATIVO DE LANZAMIENTO</text>

  <text x="80" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="40" font-weight="800">Cronograma de Lanzamiento (Gantt a 8 Semanas)</text>
  <text x="80" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="19">De la constitución societaria a la salida en producción y adquisición de clientes</text>

  <!-- Gantt Chart Container -->
  <rect x="80" y="215" width="1440" height="630" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Gantt Header (Weeks 1 to 8) -->
  <rect x="80" y="215" width="1440" height="60" rx="14" fill="#0b0f19" />
  <text x="110" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">HITO / TAREA OPERATIVA</text>

  <text x="590" y="252" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEM 1</text>
  <text x="710" y="252" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEM 2</text>
  <text x="830" y="252" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEM 3</text>
  <text x="950" y="252" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEM 4</text>
  <text x="1070" y="252" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEM 5</text>
  <text x="1190" y="252" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEM 6</text>
  <text x="1310" y="252" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEM 7</text>
  <text x="1430" y="252" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SEM 8</text>
  <line x1="80" y1="275" x2="1520" y2="275" stroke="#334155" stroke-width="1.5" />

  <!-- Vertical grid guidelines -->
  <line x1="650" y1="275" x2="650" y2="845" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />
  <line x1="770" y1="275" x2="770" y2="845" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />
  <line x1="890" y1="275" x2="890" y2="845" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />
  <line x1="1010" y1="275" x2="1010" y2="845" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />
  <line x1="1130" y1="275" x2="1130" y2="845" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />
  <line x1="1250" y1="275" x2="1250" y2="845" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />
  <line x1="1370" y1="275" x2="1370" y2="845" stroke="#1e293b" stroke-width="1" stroke-dasharray="4" />

  <!-- Task 1: Legal SAS -->
  <text x="110" y="320" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">1. Constitución Legal S.A.S. e Inscripción AFIP/ARBA</text>
  <rect x="540" y="300" width="220" height="32" rx="8" fill="#818cf8" fill-opacity="0.85" />
  <text x="650" y="322" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Legal S.A.S.</text>
  <line x1="110" y1="345" x2="1490" y2="345" stroke="#334155" stroke-width="0.5" />

  <!-- Task 2: Compra Mayorista -->
  <text x="110" y="390" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">2. Negociación y Compra Lote Mayorista (166 u.)</text>
  <rect x="660" y="370" width="220" height="32" rx="8" fill="#10b981" fill-opacity="0.85" />
  <text x="770" y="392" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Compra Stock Mayorista</text>
  <line x1="110" y1="415" x2="1490" y2="415" stroke="#334155" stroke-width="0.5" />

  <!-- Task 3: Desarrollo Software -->
  <text x="110" y="460" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">3. Desarrollo y Testing SPA React 19 + Firebase</text>
  <rect x="540" y="440" width="460" height="32" rx="8" fill="#38bdf8" fill-opacity="0.85" />
  <text x="770" y="462" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Desarrollo Web &amp; Testing Atómico</text>
  <line x1="110" y1="485" x2="1490" y2="485" stroke="#334155" stroke-width="0.5" />

  <!-- Task 4: Mercado Pago -->
  <text x="110" y="530" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">4. Integración Pasarela Mercado Pago &amp; Webhooks</text>
  <rect x="780" y="510" width="220" height="32" rx="8" fill="#06b6d4" fill-opacity="0.85" />
  <text x="890" y="532" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Checkout &amp; Pagos</text>
  <line x1="110" y1="555" x2="1490" y2="555" stroke="#334155" stroke-width="0.5" />

  <!-- Task 5: Envio a Full -->
  <text x="110" y="600" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">5. Envío Consolidado a Depósito Central Full</text>
  <rect x="900" y="580" width="220" height="32" rx="8" fill="#34d399" fill-opacity="0.85" />
  <text x="1010" y="602" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Ingreso a Fulfillment</text>
  <line x1="110" y1="625" x2="1490" y2="625" stroke="#334155" stroke-width="0.5" />

  <!-- Task 6: Pre-lanzamiento -->
  <text x="110" y="670" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">6. Campaña Pre-Lanzamiento y Branding Digital</text>
  <rect x="1020" y="650" width="220" height="32" rx="8" fill="#f59e0b" fill-opacity="0.85" />
  <text x="1130" y="672" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Branding &amp; Tráfico</text>
  <line x1="110" y1="695" x2="1490" y2="695" stroke="#334155" stroke-width="0.5" />

  <!-- Task 7: Go Live -->
  <text x="110" y="740" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">7. Apertura Oficial y Salida a Producción</text>
  <rect x="1260" y="720" width="110" height="32" rx="8" fill="#ec4899" fill-opacity="0.95" />
  <text x="1315" y="742" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">GO-LIVE 🚀</text>
  <line x1="110" y1="765" x2="1490" y2="765" stroke="#334155" stroke-width="0.5" />

  <!-- Task 8: Optimización y Escala -->
  <text x="110" y="810" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">8. Optimización de Performance, CRO y Escala</text>
  <rect x="1260" y="790" width="230" height="32" rx="8" fill="#a855f7" fill-opacity="0.85" />
  <text x="1375" y="812" fill="#0b0f19" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Optimización &amp; Escala</text>
</svg>